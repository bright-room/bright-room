name: on-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/gradle-action
        with:
          command: check
