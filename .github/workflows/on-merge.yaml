name: on-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  seed-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/gradle-action
        with:
          command: check
