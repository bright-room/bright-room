name: renovate-update-helper

on:
  pull_request:
    branches: [main]

jobs:
  upgrade-yarn-lock:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHLOE_CHAN_APP_ID }}
          private-key: ${{ secrets.CHLOE_CHAN_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Upgrade Yarn Lock
        uses: ./.github/actions/gradle-action
        with:
          command: kotlinUpgradeYarnLock

      - name: Commit updated yarn.lock via API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git diff --quiet kotlin-js-store/ && exit 0

          HEAD_SHA=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')

          ADDITIONS="[]"
          for file in kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock; do
            if ! git diff --quiet "$file" 2>/dev/null; then
              base64 -w 0 "$file" > "/tmp/$(echo "$file" | tr '/' '_').b64"
              ADDITIONS=$(echo "$ADDITIONS" | jq \
                --arg path "$file" \
                --rawfile contents "/tmp/$(echo "$file" | tr '/' '_').b64" \
                '. + [{ path: $path, contents: $contents }]')
            fi
          done

          jq -n \
            --arg repo "${REPO}" \
            --arg branch "${BRANCH}" \
            --arg headOid "${HEAD_SHA}" \
            --argjson additions "${ADDITIONS}" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {
                    repositoryNameWithOwner: $repo,
                    branchName: $branch
                  },
                  message: {
                    headline: "update kotlin-js-store/yarn.lock"
                  },
                  fileChanges: {
                    additions: $additions
                  },
                  expectedHeadOid: $headOid
                }
              }
            }' > /tmp/graphql-input.json

          gh api graphql \
            --input /tmp/graphql-input.json \
            --jq '.data.createCommitOnBranch.commit.oid'
