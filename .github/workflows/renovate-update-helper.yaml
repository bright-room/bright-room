name: renovate-update-helper

on:
  pull_request:
    branches: [main]

jobs:
  upgrade-yarn-lock:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHLOE_CHAN_APP_ID }}
          private-key: ${{ secrets.CHLOE_CHAN_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Upgrade Yarn Lock
        uses: ./.github/actions/gradle-action
        with:
          command: kotlinUpgradeYarnLock

      - name: Commit updated yarn.lock
        run: |
          git diff --quiet kotlin-js-store/yarn.lock && exit 0
          git config user.name "chloe-chan-bot[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add kotlin-js-store/yarn.lock
          git commit -m "update kotlin-js-store/yarn.lock"
          git push
