name: renovate-update-helper

on:
  pull_request:
    branches: [main]

jobs:
  upgrade-yarn-lock:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHLOE_CHAN_APP_ID }}
          private-key: ${{ secrets.CHLOE_CHAN_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Upgrade Yarn Lock
        uses: ./.github/actions/gradle-action
        with:
          command: kotlinUpgradeYarnLock

      - name: Commit updated yarn.lock via API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git diff --quiet kotlin-js-store/yarn.lock && exit 0

          FILE_SHA=$(gh api "repos/${REPO}/contents/kotlin-js-store/yarn.lock?ref=${BRANCH}" --jq '.sha')
          CONTENT=$(base64 -w 0 kotlin-js-store/yarn.lock)

          gh api "repos/${REPO}/contents/kotlin-js-store/yarn.lock" \
            --method PUT \
            --field "message=update kotlin-js-store/yarn.lock" \
            --field "content=${CONTENT}" \
            --field "sha=${FILE_SHA}" \
            --field "branch=${BRANCH}"
