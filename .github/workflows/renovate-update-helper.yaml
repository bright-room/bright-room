name: renovate-update-helper

on:
  pull_request:
    branches: [main]

jobs:
  upgrade-yarn-lock:
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CHLOE_CHAN_APP_ID }}
          private-key: ${{ secrets.CHLOE_CHAN_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Upgrade Yarn Lock
        uses: ./.github/actions/gradle-action
        with:
          command: kotlinUpgradeYarnLock

      - name: Commit updated yarn.lock via API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          git diff --quiet kotlin-js-store/yarn.lock && exit 0

          CONTENT=$(base64 -w 0 kotlin-js-store/yarn.lock)
          BLOB_SHA=$(gh api "repos/${REPO}/git/blobs" \
            --method POST \
            --field "content=${CONTENT}" \
            --field "encoding=base64" \
            --jq '.sha')

          HEAD_SHA=$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          BASE_TREE=$(gh api "repos/${REPO}/git/commits/${HEAD_SHA}" --jq '.tree.sha')

          TREE_SHA=$(gh api "repos/${REPO}/git/trees" \
            --method POST \
            --field "base_tree=${BASE_TREE}" \
            --input - <<TREE_JSON | jq -r '.sha'
          {"tree":[{"path":"kotlin-js-store/yarn.lock","mode":"100644","type":"blob","sha":"${BLOB_SHA}"}]}
          TREE_JSON
          )

          COMMIT_SHA=$(gh api "repos/${REPO}/git/commits" \
            --method POST \
            --field "message=update kotlin-js-store/yarn.lock" \
            --field "tree=${TREE_SHA}" \
            --field "parents[]=${HEAD_SHA}" \
            --jq '.sha')

          gh api "repos/${REPO}/git/refs/heads/${BRANCH}" \
            --method PATCH \
            --field "sha=${COMMIT_SHA}"
