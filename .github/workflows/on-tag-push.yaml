name: on-tag-push

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Fetch GitHub Data
        run: ./.github/scripts/fetch-github-data.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Gradle
        uses: ./.github/actions/gradle-action
        with:
          command: wasmJsBrowserDistribution

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dist/wasmJs/productionExecutable

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  release:
    name: GitHub Release
    needs: deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  close-milestone:
    name: Close Milestone
    needs: release
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Close milestone matching release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          MILESTONE_NUMBER=$(gh api "repos/$REPO/milestones?state=open" \
            --jq ".[] | select(.title == \"$TAG\") | .number")

          if [ -z "$MILESTONE_NUMBER" ]; then
            echo "No open milestone found for tag '$TAG'. Skipping."
            exit 0
          fi

          gh api -X PATCH "repos/$REPO/milestones/$MILESTONE_NUMBER" \
            -f state=closed

          echo "Closed milestone '$TAG' (#$MILESTONE_NUMBER)."
