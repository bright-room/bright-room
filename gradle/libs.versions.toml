[versions]
java = "25"
kotlin_version = { strictly = "2.3.20" }
compose_multiplatform_version = { strictly = "1.10.3" }
material3 = { strictly = "1.10.0-alpha05" }
lifecycle = { strictly = "2.10.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin_version" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin_version" }

compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose_multiplatform_version" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin_version" }

spotless = { id = "com.diffplug.spotless", version = { strictly = "8.4.0" } }

[libraries]
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = { strictly = "0.7.1-0.6.x-compat" } }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = { strictly = "1.11.0" } }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose_multiplatform_version" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose_multiplatform_version" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose_multiplatform_version" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose_multiplatform_version" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose_multiplatform_version" }
compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version = { strictly = "1.3.0-alpha06" } }
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = { strictly = "1.7.3" } }
material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
